# IMPORTANT: velocity in testing (modifiable)
velocity: 6.0
fixed_height: 0.8  # keep the local terminal altitude fixed in world frame

# IMPORTANT: vel_max and acc_max in training
# not the actual values in testing, ensure consistency between testing and training, please refer to ../policy/primitive.py
vel_max_train: 6.0
acc_max_train: 6.0

# IMPORTANT: weight of costs for unit speed (can be visualized in tensorboard)
wg: 0.15   # guidance     (approaching the goal)
ws: 10.0   # smoothness   (smaller jerk)
wa: 1.0    # acceleration (smaller acceleration)
wc: 2.0    # collision    (distance to obstacle)
wh: 20.0   # height hold  (keep the local trajectory close to the fixed-height plane)

# dataset: set image_size = primitive_num × downsampling_factor (×32 for ResNet-18) in each axis
# AirSim360 风格全 ERP: image_height = vertical_num × 32 = 6 × 32 = 192, image_width = horizon_num × 32 = 12 × 32 = 384
dataset_path: "../dataset"
image_height: 192
image_width: 384
image_channels: 2     # 0: normalized depth, 1: validity mask (1=valid)

# trajectory and primitive param (Note: traj_time = 2 * radio / vel_max) (can be visualized in rviz)
horizon_num: 12               # 12 anchors evenly spaced over 360°
vertical_num: 6               # AirSim360 全 ERP: 6 anchors over 180° vertical
horizon_camera_fov: 360.0     # full panorama
vertical_camera_fov: 180.0    # AirSim360 全 ERP 垂直覆盖
horizon_anchor_fov: 30.0      # 360 / 12 = 30, exact closed loop
vertical_anchor_fov: 30.0     # 180 / 6 = 30, exact closed loop
radio_range: 5.0    # planning horizon: 2 * radio_range
radio_num: 1        # only support 1 currently

# safety penalties
d0: 1.2
r: 0.6

# distribution for unit state sampling (can be visualized by 'python ./policy/yopo_dataset.py')
# yaw-following: drone rotates to face goal, so vx is forward-biased (log-normal),
# and goal direction is concentrated in front of the body (Normal with std ≈ 30°).
vx_isotropic: false
vx_mean_unit: 0.4
vy_mean_unit: 0.0
vz_mean_unit: 0.0
vx_std_unit: 2.0      # lognormal sigma = log(vx_std_unit), must be > 0 ⇒ keep > 1
vy_std_unit: 0.45
vz_std_unit: 0.3
ax_mean_unit: 0.0
ay_mean_unit: 0.0
az_mean_unit: 0.0
ax_std_unit: 0.5
ay_std_unit: 0.5
az_std_unit: 0.3
goal_pitch_std: 0.0   # keep the training goal on the fixed-height plane
goal_yaw_std: 30.0    # yaw-following: goal direction concentrated within ±60° of forward (2σ)
goal_yaw_uniform: false   # if true, sample goal yaw from Uniform(-180°, 180°) instead of Normal(0, goal_yaw_std)
height_loss_eval_points: 30

# extend the map to avoid trajectory exceeding bounds (especially in z-axis) and treating the sky outside the map as obstacle
map_expand_min: [0, 0, 0.2]
map_expand_max: [0, 0, 6.0]
